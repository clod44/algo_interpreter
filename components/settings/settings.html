<link rel="stylesheet" href="lib/bootstrap-5.3.8-dist/css/bootstrap.min.css">
<link rel="stylesheet" href="lib/font/bootstrap-icons-1.13.1/bootstrap-icons.min.css">

<dialog id="debug-settings-dialog" class="bg-body text-body border rounded shadow p-3" style="width: min(350px, 90vw);">
    <form method="dialog" id="debug-settings-form" class="d-flex flex-column gap-2">
        <div class="d-flex justify-content-between align-items-center mb-1">
            <h2 class="h6 fw-bold mb-0">Debugger settings</h2>
            <button type="button" class="btn-close" onclick="this.closest('dialog').close('cancel')" aria-label="Close"></button>
        </div>
        
        <div class="form-check form-switch mb-0">
            <input id="toggle-theme" class="form-check-input" type="checkbox" role="switch"> 
            <label class="form-check-label small" for="toggle-theme">Dark mode</label>
        </div>
        <hr class="my-1 text-secondary">
        <div class="form-check form-switch mb-0">
            <input id="toggle-code" class="form-check-input" type="checkbox" role="switch" checked> 
            <label class="form-check-label small" for="toggle-code">Code view</label>
        </div>
        <div class="form-check form-switch mb-0">
            <input id="toggle-output" class="form-check-input" type="checkbox" role="switch" checked> 
            <label class="form-check-label small" for="toggle-output">Output window</label>
        </div>
        <div class="form-check form-switch mb-0">
            <input id="toggle-memory" class="form-check-input" type="checkbox" role="switch" checked> 
            <label class="form-check-label small" for="toggle-memory">Memory view</label>
        </div>
        
        <div class="mt-2">
            <label class="form-label d-flex justify-content-between small text-secondary mb-1" for="output-chars">
                Output width <span><output id="output-chars-value">80</output> chars</span>
            </label>
            <input id="output-chars" class="form-range" type="range" min="20" max="160" step="5" value="80">
        </div>
        
        <div class="d-flex justify-content-end mt-1">
            <button class="btn btn-primary btn-sm px-3 py-1" value="default">Done</button>
        </div>
    </form>
</dialog>
